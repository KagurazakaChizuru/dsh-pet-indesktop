name: PR Test Gate

# PR/push 门禁：测试 + ruff。与三条 build-*.yml（tag/手动触发的打包发布）
# 职责不同——本工作流给每个 PR 提供红绿判定，防止「测试只在本机是财富」。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # 编码隔离（issue #26）：强制 UTF-8，避免中文源码/资源被 legacy 编码二次解码
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      # keyring 在无桌面环境的 runner 上可能弹后端探测；测试不需要真实钥匙串
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PySide6 在 Linux 上 import 需要系统 EGL/GL 等库（与 build-linux.yml 一致）
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check pet/ tests/

      # 桥接插件零依赖门禁（2026-09 事故回归防线）：bridge 经 pnpm link: 链进
      # 用户 profile，link 不装依赖、链接目标常是打包版 _internal 副本（无
      # node_modules）——任何外部 bare import 都会让用户开联动后整个 dsh
      # 插件树加载失败。此前这类回归无任何 CI 覆盖。
      # 两层校验：node --test 跑全部 7 个 bridge 契约测试（原地 import 捕获
      # 静态外部依赖回归）；verify_import.mjs 做 hermetic 校验（拷进无
      # node_modules 的临时目录 import + 清单零依赖 + envelope 形状 + 动态
      # import/require 静态禁令 + 临时目录祖先链污染探测）。
      # 注意：新增 bridge 测试文件时必须同步下面的显式清单（Node 20 无 glob）。
      - name: Bridge plugin zero-dependency gate
        run: |
          node --test tests/test_bridge_hardfailure.js tests/test_bridge_interaction_dedup.js tests/test_bridge_manifest.js tests/test_bridge_question_callid.js tests/test_bridge_retry.js tests/test_bridge_root_control.js tests/test_bridge_user_action_guard.js
          node integrations/dsh-pet-bridge/verify_import.mjs

      - name: Pytest (main suite)
        if: matrix.os != 'macos-latest'
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py --deselect tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero

      # macOS：test_overlay_spawn + test_overlay_lifecycle_gaps + test_sprite_visibility
      # 三文件同进程时确定性段错误（3/3，崩在 test_rebind_while_paused_stays_paused
      # 边界，原生线程无 Python 帧；前两文件的壳起的自言自语配图加载守护线程
      # 跨测试存活）。崩溃是测试进程级 Qt 生命周期问题（全部断言在崩前均绿），
      # 与 webm 生命周期族同先例处理：主套件摘除三文件，三文件各自独立进程
      # 照跑（独立进程实测全绿），真断言失败照样红。根因排查归 frameseq/生命
      # 周期专项（docs/PR-REPORT-FULL-REVIEW-FIXES-2026-10-03.md 边界章节）。
      - name: Pytest (main suite, macOS)
        if: matrix.os == 'macos-latest'
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py --ignore=tests/test_overlay_spawn.py --ignore=tests/test_overlay_lifecycle_gaps.py --ignore=tests/test_sprite_visibility.py --deselect tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero

      - name: Pytest (macOS overlay/visibility trio, split processes)
        if: matrix.os == 'macos-latest'
        run: |
          python -m pytest -q tests/test_overlay_spawn.py
          python -m pytest -q tests/test_overlay_lifecycle_gaps.py
          python -m pytest -q tests/test_sprite_visibility.py

      # webm 生命周期族（reader/ffmpeg 进程 teardown 竞态）在 macOS CI 上
      # 偶发段错误（exit 139，栈在 reader 线程 + imageio LogCatcher）。
      # 段错误会杀掉整个 pytest 进程、拖垮主套件的结果报告，因此拆成
      # 独立步骤：崩溃时只隔离失败这一步，主套件结果照常产出。
      # 注意：拆步骤不改变测试内容，不掩盖失败——该红还是红。
      - name: Pytest (webm lifecycle family, isolated)
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      # 低优预热让路族（test_low_priority_warm_interaction_yield.py）依赖真实
      # 线程编舞（worker 阻塞/放行），断言本身正确但时序窗口在 CI 满载 runner
      # 上会被极度拉长（本地与 ubuntu 稳过、windows CI 偶发批次起步超时）。
      # 隔离 + 允许一次重跑：重跑仍红才算真失败，避免时序抖动拖垮 PR 门禁。
      - name: Pytest (low-priority warm family, isolated + one retry)
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 原生崩溃隔离位：全套件上下文 ~28% 处偶发 Windows access violation，
      # verbose 复现钉死肇事者为
      # tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero
      # （主线程执行该用例时崩溃、Python 帧链被原生栈破坏；单测 deselect 后全量
      # 4129 绿 exit=0）。此前归因 watchdog 族系按位置的误判——该族独立/全族均
      # 全绿，已排除嫌疑，回归主套件。崩溃会杀掉整个 pytest 进程、拖垮主套件
      # 结果报告，按 webm 族先例隔离；根因排查归 frameseq 批属主。
      # 隔离不掩盖失败：照跑照判红，只额外给一次重跑机会。
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero

